name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  migration-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Migratiedrift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-migration-drift.mjs

  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/peppolpro-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Concise test failures"
            grep -E -A18 -B4 'not ok|AssertionError|ERR_ASSERTION|failureType|error:' /tmp/peppolpro-test.log | tail -n 240 || true
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          SUPABASE_SERVICE_ROLE_KEY: dummy
          MOLLIE_API_KEY: dummy
          GEMINI_API_KEY: dummy
          BREVO_API_KEY: dummy
          CRON_SECRET: dummy
          ADMIN_SECRET: dummy
          NEXT_PUBLIC_APP_URL: https://peppolpro.nl
          NEXT_PUBLIC_SITE_URL: https://peppolpro.nl
        run: npx next build
