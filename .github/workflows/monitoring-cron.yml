name: PeppolPro monitoring cron

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  monitoring-check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monitoring check
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --header "Content-Type: application/json" \
            https://peppolpro.nl/api/cron/monitoring-check
      - name: Daily retention cleanup
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
        run: |
          if [ "$(date -u +%H)" = "02" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              --header "Content-Type: application/json" \
              https://peppolpro.nl/api/cron/retention-cleanup
          else
            echo "Retention cleanup skipped; runs daily at 02:00 UTC."
          fi
